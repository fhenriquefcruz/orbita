name: Testes ORBITA
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependências de testes Python
        run: python -m pip install -r requirements-dev.txt
      - name: Testes Python (sem credenciais)
        working-directory: telegram
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testes de conciliação e integridade da memória local
        run: node --test quality/test_cloud_core.cjs quality/test_local_integrity.cjs quality/test_service_worker.cjs
      - name: Validação da sintaxe JavaScript
        run: |
          node --check docs/local-integrity.js
          node --check docs/auth.js
          node --check docs/cloud-core.js
          node --check docs/cloud-sync.js
          node --check docs/theme.js
          node --check docs/sw.js
          test -s docs/design-aurora.css
      - name: Instalar navegador de teste
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Smoke test do painel autenticado
        run: python quality/browser_smoke.py
      - name: Verificação de arquivos sensíveis
        run: |
          test ! -e telegram/.env
          test ! -e telegram/orbita.sqlite3
          test ! -e .env
          python - <<'PYSCAN'
          from pathlib import Path
          import re,sys
          paths=[p for p in Path('.').rglob('*') if p.is_file() and '.git' not in p.parts]
          leaked=[]
          for p in paths:
              if p.suffix in ('.png','.jpg','.jpeg','.zip','.webp','.pdf','.pyc'): continue
              s=p.read_text(encoding='utf-8',errors='replace')
              if re.search(r'(?<![A-Za-z0-9])\d{8,12}:AA[A-Za-z0-9_-]{25,}',s): leaked.append(str(p))
          if leaked: sys.exit('Possível token Telegram incluído: '+', '.join(leaked))
          PYSCAN
  windows-backup-safety:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar sintaxe dos scripts de backup no PowerShell Windows
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $files = @(
            ".\\quality\\private_database_backup_windows.ps1",
            ".\\quality\\verify_database_backup_windows.ps1",
            ".\\quality\\private_restore_preflight_windows.ps1",
            ".\\quality\\private_restore_native_windows_preflight.ps1",
            ".\\quality\\private_restore_native_windows_cluster.ps1",
            ".\\quality\\private_restore_archive_inventory_windows.ps1",
            ".\\quality\\private_restore_native_windows_verify.ps1",
            ".\\quality\\private_restore_native_windows_diagnose.ps1"
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $file).Path, [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              throw "Falha de sintaxe no script de backup $file."
            }
            Write-Output "PowerShell 5.1: sintaxe validada"
          }
      - name: Confirmar sondagem npx offline no preflight
        shell: powershell
        run: |
          $text = Get-Content ".\\quality\\private_restore_preflight_windows.ps1" -Raw
          if ($text -notmatch '--offline --yes supabase --version') {
            throw "A verificacao via npx deve ser exclusivamente offline."
          }
          if ($text -notmatch 'npx.cmd' -or $text -notmatch 'Supabase CLI: DISPONIVEL') {
            throw "O fallback de CLI via npx.cmd desapareceu."
          }
          if ($text -match 'supabase (db push|db reset|link)') {
            throw "Operacao remota ou destrutiva nao permitida no preflight."
          }
          Write-Output "Fallback npx offline preservado; sem alteracao de banco."
      - name: Exercitar preflight PostgreSQL nativo sem dados na CI
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $output = @(& powershell.exe -NoProfile -ExecutionPolicy RemoteSigned -File ".\quality\private_restore_native_windows_preflight.ps1" -ToolsOnly)
          if ($LASTEXITCODE -ne 0) {
            throw "Preflight nativo falhou."
          }
          $joined = $output -join [Environment]::NewLine
          if ($joined -notmatch 'BACKUP: verificacao pulada' -or
              $joined -notmatch 'SEGURANCA: nenhuma instalacao' -or
              $joined -notmatch 'restauracao completa NAO COMPROVADA') {
            throw "Invariantes de seguranca ausentes no preflight nativo."
          }
          Write-Output "Preflight PostgreSQL nativo: leitura apenas, sem backup privado na CI."
      - name: Garantir isolamento da recuperacao nativa
        shell: powershell
        run: |
          $text = Get-Content ".\quality\private_restore_native_windows_preflight.ps1" -Raw
          if ($text -notmatch 'LocalAddress -eq "0.0.0.0"' -or
              $text -notmatch 'LocalAddress -eq "::"') {
            throw "Preflight nao sinaliza listeners wildcard."
          }
          if ($text -notmatch '55432' -or $text -notmatch 'restauracao completa NAO COMPROVADA') {
            throw "Gate de isolamento/restauracao foi removido."
          }
          if ($text -match '(?m)^\s*(?:&\s*[\w$]+\s+)?(?:pg_restore|dropdb|initdb|createdb)\s') {
            throw "Nao se permite restauracao/criacao no preflight diagnostico."
          }
          Write-Output "Gate nativo: sem escrita; 5432 reservada e restauracao ainda pendente."
      - name: Validar guardas e exercitar somente -Check do cluster isolado
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $script = Get-Content ".\quality\private_restore_native_windows_cluster.ps1" -Raw
          if ($script -notmatch 'ORBITA-ISOLATED-55432' -or
              $script -notmatch 'port = 55432' -or
              $script -notmatch "listen_addresses = '127\.0\.0\.1'" -or
              $script -notmatch 'scram-sha-256' -or
              $script -notmatch '--pwprompt') {
            throw "Protecoes de cluster local incompletas."
          }
          if ($script -match '(?m)^\s*(?:&\s*[\w$]+\s+)?pg_restore\s' -or
              $script -match '(?m)^\s*(?:&\s*[\w$]+\s+)?dropdb\s') {
            throw "Cluster manager nao pode executar restore nem apagar databases."
          }
          $output = @(& powershell.exe -NoProfile -ExecutionPolicy RemoteSigned -File ".\quality\private_restore_native_windows_cluster.ps1" -Check)
          if ($LASTEXITCODE -ne 0) { throw "Check Windows falhou." }
          $joined = $output -join [Environment]::NewLine
          if ($joined -notmatch 'CHECK LOCAL' -or
              $joined -notmatch 'SEGURANCA: nenhuma criacao de arquivos') {
            throw "Modo somente leitura ausente."
          }
          Write-Output "Cluster isolado: parser e -Check aprovados sem criar qualquer banco."
      - name: Testar inventario offline e isolamento sem arquivos privados
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $scripts = @(
            ".\quality\private_restore_archive_inventory_windows.ps1",
            ".\quality\private_restore_native_windows_verify.ps1"
          )
          foreach ($script in $scripts) {
            $results = @(& powershell.exe -NoProfile -ExecutionPolicy RemoteSigned -File $script -SelfTest)
            if ($LASTEXITCODE -ne 0 -or
                ($results -join " ") -notmatch 'AUTOTESTE APROVADO') {
              throw "Autoteste Windows offline falhou: $script"
            }
          }
          $inventory = Get-Content ".\quality\private_restore_archive_inventory_windows.ps1" -Raw
          $verify = Get-Content ".\quality\private_restore_native_windows_verify.ps1" -Raw
          if ($inventory -notmatch 'pgRestore --list' -or
              $inventory -match 'pgRestore .*--dbname' -or
              $verify -notmatch '127.0.0.1' -or $verify -notmatch 'postmaster.pid') {
            throw "Protecao de inventario/identidade local ausente."
          }
          Write-Output "Aurora 3.37: analisadores offline OK, sem backup ou cluster de CI."
      - name: Diagnosticar start transitorio com logs sinteticos e sem expor dados
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $script = ".\quality\private_restore_native_windows_diagnose.ps1"
          $results = @(& powershell.exe -NoProfile -ExecutionPolicy RemoteSigned -File $script -SelfTest)
          if ($LASTEXITCODE -ne 0 -or ($results -join " ") -notmatch 'AUTOTESTE APROVADO') {
            throw "Autoteste de classificacao sanitizada falhou."
          }
          $source = Get-Content $script -Raw
          if ($source -notmatch 'Get-Content -LiteralPath \$log -Tail 300' -or
              $source -notmatch 'Get-EventCategory' -or
              $source -match '(?m)^\s*(?:pg_restore|dropdb|initdb|createdb|pg_ctl start)\s') {
            throw "Guardas de privacidade/leitura do diagnostico ausentes."
          }
          Write-Output "Diagnostico de inicio/encerramento validado sem revelar logs."
      - name: Garantir que o gate Windows nao le credenciais na CI
        shell: powershell
        run: |
          $text = Get-Content ".\\quality\\private_database_backup_windows.ps1" -Raw
          if ($text -notmatch '\[switch\]\$CheckPrerequisites') {
            throw "O modo apenas diagnostico foi removido."
          }
          if ($text -notmatch 'RESTAURACAO PENDENTE') {
            throw "O bloqueio de restauracao nao foi encontrado."
          }
          Write-Output "Gate de backup continua manual; CI nao conecta ao Supabase"
